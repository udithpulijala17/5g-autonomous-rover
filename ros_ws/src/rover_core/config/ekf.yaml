ekf_filter_node:
  ros__parameters:

    frequency: 30.0

    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true

    # Predict the filter to current time rather than relying
    # on a delayed future TF for the LiDAR timestamp.
    predict_to_current_time: false

    # Shift the published odom TF slightly backward so that
    # it aligns with the LiDAR scan timestamps.
    transform_time_offset: -0.068

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data

    # x, y, z
    # roll, pitch, yaw
    # vx, vy, vz
    # vroll, vpitch, vyaw
    # ax, ay, az

    imu0_config: [
      false, false, false,
      true,  true,  true,
      false, false, false,
      true,  true,  true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: true

    # We are NOT using accelerometer integration yet.
    imu0_remove_gravitational_acceleration: false
